[mypy]
# Static type checking configuration (Subject III.1: all functions must pass
# mypy without errors).
#
# The `exclude` patterns keep the build artifacts (build/, dist/) and the
# MiniLibX sources extracted from mlx-2.2.tgz out of the analysis, so that
# `mypy .` never reports a module twice. The project sources themselves are
# still fully checked - see `make lint`.
exclude = ^(build|dist|src|fedora|ubuntu|\.venv|venv)/

# The mandatory lint target of the subject already runs mypy with
# --ignore-missing-imports, so the same flag is set here to keep `make
# lint-strict` consistent with it.
ignore_missing_imports = True

# The test suite uses the pytest parametrization decorator, which ships no
# type information: the decorator rule is relaxed for that file only.
[mypy-test_a_maze_ing]
disallow_untyped_decorators = False
